type: object
required:
  - amount
  - type
  - status
  - itemId
  - userId
properties:
  amount:
    type: number
    example: 199.99
  type:
    type: string
    example: "offer"
  status:
    type: string
    example: "pending"
  itemId:
    type: integer
    example: 3
  userId:
    type: integer
    example: 7
