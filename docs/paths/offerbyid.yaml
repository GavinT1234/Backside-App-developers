get:
  summary: Retrieve a single offer by ID
  tags:
    - Offers
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the offer to retrieve
      schema:
        type: integer
        example: 1
  responses:
    '200':
      description: Offer retrieved successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Offer.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404':
      description: Offer not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/NotFoundError.yaml

put:
  summary: Update an existing offer
  tags:
    - Offers
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        example: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/OfferUpdate.yaml
  responses:
    '200':
      description: Offer updated successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Offer.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404':
      description: Offer not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/NotFoundError.yaml

delete:
  summary: Delete an offer
  tags:
    - Offers
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        example: 1
  responses:
    '204':
      description: Offer deleted successfully, no content returned
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404':
      description: Offer not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/NotFoundError.yaml
