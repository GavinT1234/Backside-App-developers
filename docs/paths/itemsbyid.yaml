get: 
  summary: Get an item by ID
  tags:
    - Items
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  responses:
    '200':
      description: Item retrieved successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Item.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
put:
  summary: Update an existing item
  tags:
    - Items
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/ItemUpdate.yaml
  responses:
    '200':
      description: Item updated successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Item.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
delete:
  summary: Delete an existing item
  tags:
    - Items
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  responses:
    '204':
      description: Item deleted successfully
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404':
      $ref: ../components/responses/NotFound.yaml
