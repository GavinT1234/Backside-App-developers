get:
  summary: List all categories
  tags:
    - Categories
  responses:
    '200':
      description: Categories retrieved successfully
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Category.yaml
post:
  summary: Create a new category
  tags:
    - Categories
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/CategoryCreate.yaml
  responses:
    '201':
      description: Category created successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Category.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
