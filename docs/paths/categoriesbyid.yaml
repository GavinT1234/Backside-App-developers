get:
  summary: get categories by ID
  tags:
    - Categories
  parameters:
    - name: id  
      in: path 
      required: true
      description: ID of the category to retrieve
      schema:
        type: integer
        example: 1
  responses:
    '200':
      description: Category retrieved successfully
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Category.yaml
put:
   summary: Update an existing category
   tags:
     - Categories
   parameters:
     - name: id
       in: path
       required: true
       description: ID of the category to update
       schema:
          type: integer
          example: 1
   requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CategoryUpdate.yaml
   responses:
     '200':
       description: Category updated successfully
       content:
         application/json:
           schema:
             $ref: ../components/schemas/Category.yaml
delete:
  summary: Delete an existing category
  tags:
    - Categories
  parameters:
    - name: id
      in: path
      required: true
      description: ID of the category to delete
      schema:
        type: integer
        example: 1
  responses:
    '204':
      description: Category deleted successfully
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '404':
      description: Category not found
      content:
        application/json:
          schema:
            $ref: ../components/schemas/NotFoundError.yaml