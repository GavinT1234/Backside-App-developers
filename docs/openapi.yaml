openapi: 3.1.0
info:
  title: Collectors Market API
  version: 1.0.0
  description: API for managing users, items, categories, and offers. JWT-based auth.

servers:
  - url: http://localhost:3000
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # Users
    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        displayName:
          type: string
          example: "JohnDoe"
        email:
          type: string
          example: "john@example.com"
      required:
        - id
        - displayName
        - email

    UserCreate:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          example: "securePassword123"
        displayName:
          type: string
          example: "JohnDoe"
      required:
        - email
        - password
        - displayName

    UserLogin:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "john@example.com"
        password:
          type: string
          example: "securePassword123"
      required:
        - email
        - password

    UserUpdate:
      type: object
      properties:
        displayName:
          type: string
          example: "JohnDoeUpdated"
      required:
        - displayName

    # Categories
    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Collectibles"
      required:
        - id
        - name

    CategoryCreate:
      type: object
      properties:
        name:
          type: string
          example: "Collectibles"
      required:
        - name

    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          example: "Updated Name"
      required:
        - name

    # Items
    Item:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: "Nintendo Switch"
        price:
          type: number
          format: float
          example: 250.00
        categoryId:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
      required:
        - id
        - title
        - price
        - categoryId
        - userId

    ItemCreate:
      type: object
      properties:
        title:
          type: string
          example: "Nintendo Switch"
        price:
          type: number
          format: float
          example: 250.00
        categoryId:
          type: integer
          example: 1
        userId:
          type: integer
          example: 1
      required:
        - title
        - price
        - categoryId
        - userId

    ItemUpdate:
      type: object
      properties:
        title:
          type: string
        price:
          type: number
      required:
        - title
        - price

    # Offers
    Offer:
      type: object
      properties:
        id:
          type: integer
          example: 1
        amount:
          type: number
          example: 200.00
        type:
          type: string
          enum: [purchase, trade, offer, bid]
          example: "purchase"
        status:
          type: string
          enum: [pending, accepted, declined]
          example: "pending"
        itemId:
          type: integer
          example: 1
        userId:
          type: integer
          example: 2
      required:
        - id
        - amount
        - type
        - status
        - itemId
        - userId

    OfferCreate:
      type: object
      properties:
        amount:
          type: number
          example: 199.99
        type:
          type: string
          example: "offer"
        status:
          type: string
          example: "pending"
        itemId:
          type: integer
          example: 1
        userId:
          type: integer
          example: 2
      required:
        - amount
        - type
        - itemId
        - userId

    OfferUpdate:
      type: object
      properties:
        amount:
          type: number
        status:
          type: string

    # Errors
    BadRequestError:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer
        error:
          type: string

    UnauthorizedError:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer
        error:
          type: string

    NotFoundError:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer
        error:
          type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedError'
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundError'

security:
  - BearerAuth: []

paths:

  # AUTH
  /auth/signup:
    post:
      summary: Create a new user (signup)
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /auth/login:
    post:
      summary: Login and receive JWT
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: "eyJhbGciOi..."
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # USERS (protected read/list/update/delete, signup public)
  /users:
    get:
      summary: List all users (admin)
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a user (alternate signup)
      tags:
        - Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get a user by id
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update user profile (owner)
      tags:
        - Users
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      summary: Delete user (owner/admin)
      tags:
        - Users
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'

  # CATEGORIES
  /categories:
    get:
      summary: List categories
      tags:
        - Categories
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
    post:
      summary: Create a category
      tags:
        - Categories
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          $ref: '#/components/responses/BadRequest'

  /categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get category by id
      tags:
        - Categories
      responses:
        '200':
          description: Category
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update category
      tags:
        - Categories
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
    delete:
      summary: Delete category
      tags:
        - Categories
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted

  # ITEMS
  /items:
    get:
      summary: List items
      tags:
        - Items
      responses:
        '200':
          description: Items list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
    post:
      summary: Create item
      tags:
        - Items
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '400':
          $ref: '#/components/responses/BadRequest'

  /items/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get item
      tags:
        - Items
      responses:
        '200':
          description: Item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update item (owner)
      tags:
        - Items
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
    delete:
      summary: Delete item (owner/admin)
      tags:
        - Items
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted

  # OFFERS
  /offers:
    get:
      summary: List offers
      tags:
        - Offers
      responses:
        '200':
          description: Offers list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Offer'
    post:
      summary: Create an offer
      tags:
        - Offers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '400':
          $ref: '#/components/responses/BadRequest'

  /offers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Get offer
      tags:
        - Offers
      responses:
        '200':
          description: Offer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: Update offer
      tags:
        - Offers
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Offer'
    delete:
      summary: Delete offer (withdraw)
      tags:
        - Offers
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Deleted
